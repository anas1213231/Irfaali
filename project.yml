name: Irfaali
options:
  bundleIdPrefix: com.anas1213231
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    TARGETED_DEVICE_FAMILY: 1
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_STRICT_CONCURRENCY: targeted
configs:
  Debug: debug
  Release: release
targets:
  Irfaali:
    type: application
    platform: iOS
    sources:
      - path: Irfaali
    info:
      path: Irfaali/Resources/Info.plist
      properties:
        CFBundleDisplayName: ارفعلي
        CFBundleName: Irfaali
        CFBundleDevelopmentRegion: ar
        NSPhotoLibraryUsageDescription: يستخدم ارفعلي مكتبة الصور لاختيار الفيديو الذي تريد تحليله ومعالجته.
        NSPhotoLibraryAddUsageDescription: يستخدم ارفعلي مكتبة الصور لحفظ الفيديو الناتج عندما تطلب ذلك.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anas1213231.irfaali
        PRODUCT_NAME: ارفعلي
        PRODUCT_MODULE_NAME: Irfaali
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
  IrfaaliTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: IrfaaliTests
    dependencies:
      - target: Irfaali
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anas1213231.irfaali.tests
        PRODUCT_MODULE_NAME: IrfaaliTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Irfaali:
    build:
      targets:
        Irfaali: all
        IrfaaliTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - IrfaaliTests
