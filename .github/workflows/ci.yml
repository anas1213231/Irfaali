name: iOS CI

on:
  push:
    branches: [main, "feature/**", "build/**"]
  pull_request:

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Prepare app icon
        run: bash scripts/prepare_app_icon.sh
      - name: Generate project
        run: xcodegen generate
      - name: Show environment
        run: |
          xcodebuild -version
          xcodegen --version
      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project Irfaali.xcodeproj \
            -scheme Irfaali \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            CODE_SIGNING_ALLOWED=NO \
            clean build
      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild \
            -project Irfaali.xcodeproj \
            -scheme Irfaali \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            CODE_SIGNING_ALLOWED=NO \
            test
