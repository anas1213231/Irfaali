name: iOS CI

on:
  push:
    branches: [main, "feature/**", "build/**", "integration/**"]
  pull_request:

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Verify splash source asset
        shell: bash
        run: |
          set -euo pipefail
          SPLASH="Irfaali/Resources/IrfaaliSplash.mp4"
          test -f "$SPLASH"
          SOURCE_SHA=$(shasum -a 256 "$SPLASH" | awk '{print $1}')
          echo "SPLASH_SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "Splash repository SHA-256: $SOURCE_SHA"

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare app icon
        run: bash scripts/prepare_app_icon.sh

      - name: Generate project
        run: |
          xcodegen generate
          grep -q "IrfaaliSplash.mp4" Irfaali.xcodeproj/project.pbxproj
          python3 - <<'PY'
          import plistlib
          with open("Irfaali/Resources/Info.plist", "rb") as stream:
              info = plistlib.load(stream)
          assert info["CFBundleShortVersionString"] == "1.1", info
          assert info["CFBundleVersion"] == "6", info
          PY

      - name: Show environment
        run: |
          xcodebuild -version
          xcodegen --version
          xcrun simctl list runtimes
          xcrun simctl list devicetypes | head -80

      - name: Create and boot CI simulator
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME_ID=$(xcrun simctl list runtimes -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          runtimes = [r for r in data.get("runtimes", []) if r.get("isAvailable") and r.get("identifier", "").startswith("com.apple.CoreSimulator.SimRuntime.iOS-")]
          if not runtimes: raise SystemExit("No available iOS Simulator runtime found")
          def version(r): return tuple(int(p) if p.isdigit() else 0 for p in str(r.get("version", "0")).split("."))
          runtimes.sort(key=version)
          print(runtimes[-1]["identifier"])
          ')
          DEVICE_TYPE_ID=$(xcrun simctl list devicetypes -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin).get("devicetypes", [])
          iphones = [d for d in devices if str(d.get("name", "")).startswith("iPhone")]
          if not iphones: raise SystemExit("No iPhone simulator device type found")
          chosen = next((d for d in iphones if d.get("name") == "iPhone 17 Pro"), None) or iphones[0]
          print(chosen["identifier"])
          ')
          UDID=$(xcrun simctl create "Irfaali CI" "$DEVICE_TYPE_ID" "$RUNTIME_ID")
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          echo "Booting simulator $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

      - name: Build for simulator
        timeout-minutes: 8
        run: |
          set -o pipefail
          xcodebuild -project Irfaali.xcodeproj -scheme Irfaali -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" -destination-timeout 120 \
            -derivedDataPath "$RUNNER_TEMP/IrfaaliSimulatorBuild" CODE_SIGNING_ALLOWED=NO clean build

      - name: Verify splash inside simulator app bundle
        shell: bash
        run: |
          set -euo pipefail
          BUNDLED="$RUNNER_TEMP/IrfaaliSimulatorBuild/Build/Products/Debug-iphonesimulator/Irfaali.app/IrfaaliSplash.mp4"
          test -f "$BUNDLED"
          BUNDLE_SHA=$(shasum -a 256 "$BUNDLED" | awk '{print $1}')
          echo "Splash simulator .app SHA-256: $BUNDLE_SHA"
          test "$SPLASH_SOURCE_SHA" = "$BUNDLE_SHA"

      - name: Build tests for simulator
        timeout-minutes: 8
        run: |
          set -o pipefail
          rm -rf "$RUNNER_TEMP/IrfaaliTestData"
          xcodebuild -project Irfaali.xcodeproj -scheme Irfaali -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" -destination-timeout 120 \
            -derivedDataPath "$RUNNER_TEMP/IrfaaliTestData" CODE_SIGNING_ALLOWED=NO \
            -parallel-testing-enabled NO build-for-testing

      - name: Run unit tests
        timeout-minutes: 8
        run: |
          set -o pipefail
          rm -rf "$RUNNER_TEMP/IrfaaliTests.xcresult"
          xcodebuild -project Irfaali.xcodeproj -scheme Irfaali -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" -destination-timeout 120 \
            -derivedDataPath "$RUNNER_TEMP/IrfaaliTestData" \
            -resultBundlePath "$RUNNER_TEMP/IrfaaliTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO -enableCodeCoverage NO \
            test-without-building

      - name: Upload test result bundle on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: IrfaaliTests-xcresult-${{ github.sha }}
          path: ${{ runner.temp }}/IrfaaliTests.xcresult
          if-no-files-found: ignore
          retention-days: 7

      - name: Shutdown CI simulator
        if: always()
        run: |
          if [ -n "${SIMULATOR_UDID:-}" ]; then
            xcrun simctl shutdown "$SIMULATOR_UDID" || true
            xcrun simctl delete "$SIMULATOR_UDID" || true
          fi

      - name: Build production Release for iPhone
        timeout-minutes: 8
        run: |
          set -euo pipefail
          xcodebuild -project Irfaali.xcodeproj -scheme Irfaali -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/IrfaaliDeviceBuild" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' build

      - name: Verify splash inside Release app bundle
        shell: bash
        run: |
          set -euo pipefail
          BUNDLED="$RUNNER_TEMP/IrfaaliDeviceBuild/Build/Products/Release-iphoneos/Irfaali.app/IrfaaliSplash.mp4"
          test -f "$BUNDLED"
          RELEASE_BUNDLE_SHA=$(shasum -a 256 "$BUNDLED" | awk '{print $1}')
          echo "SPLASH_RELEASE_BUNDLE_SHA=$RELEASE_BUNDLE_SHA" >> "$GITHUB_ENV"
          echo "Splash Release .app SHA-256: $RELEASE_BUNDLE_SHA"
          test "$SPLASH_SOURCE_SHA" = "$RELEASE_BUNDLE_SHA"

      - name: Package production IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/IrfaaliDeviceBuild/Build/Products/Release-iphoneos/Irfaali.app"
          PACKAGE="$RUNNER_TEMP/IrfaaliDevicePackage"
          test -d "$APP"
          mkdir -p "$PACKAGE/Payload"
          cp -R "$APP" "$PACKAGE/Payload/Irfaali.app"
          INFO="$PACKAGE/Payload/Irfaali.app/Info.plist"
          EXE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$INFO")
          EXE="$PACKAGE/Payload/Irfaali.app/$EXE_NAME"
          test "$(/usr/libexec/PlistBuddy -c 'Print :DTPlatformName' "$INFO")" = iphoneos
          test -x "$EXE"
          lipo -archs "$EXE" | tr ' ' '\n' | grep -qx arm64
          cd "$PACKAGE"
          /usr/bin/zip -qry Irfaali-1.1.ipa Payload
          unzip -t Irfaali-1.1.ipa
          printf '%s\n' \
            "Commit: $GITHUB_SHA" \
            "Splash repository SHA-256: $SPLASH_SOURCE_SHA" \
            "Splash Release .app SHA-256: $SPLASH_RELEASE_BUNDLE_SHA" \
            "Unsigned production Release build. Apply the owner's Apple signing before installation." \
            > BUILD-INFO.txt
          shasum -a 256 Irfaali-1.1.ipa >> BUILD-INFO.txt

      - name: Upload production IPA
        uses: actions/upload-artifact@v4
        with:
          name: Irfaali-1.1-${{ github.sha }}
          path: |
            ${{ runner.temp }}/IrfaaliDevicePackage/Irfaali-1.1.ipa
            ${{ runner.temp }}/IrfaaliDevicePackage/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 14
