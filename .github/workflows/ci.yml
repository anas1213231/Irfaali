name: iOS CI

on:
  push:
    branches: [main, "feature/**", "build/**"]
  pull_request:

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare app icon
        run: bash scripts/prepare_app_icon.sh

      - name: Generate project
        run: xcodegen generate

      - name: Show environment
        run: |
          xcodebuild -version
          xcodegen --version
          xcrun simctl list runtimes
          xcrun simctl list devicetypes | head -80

      - name: Create and boot CI simulator
        shell: bash
        run: |
          set -euo pipefail

          RUNTIME_ID=$(xcrun simctl list runtimes -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          runtimes = [r for r in data.get("runtimes", []) if r.get("isAvailable") and r.get("identifier", "").startswith("com.apple.CoreSimulator.SimRuntime.iOS-")]
          if not runtimes:
              raise SystemExit("No available iOS Simulator runtime found")
          def version(r):
              return tuple(int(p) if p.isdigit() else 0 for p in str(r.get("version", "0")).split("."))
          runtimes.sort(key=version)
          print(runtimes[-1]["identifier"])
          ')

          DEVICE_TYPE_ID=$(xcrun simctl list devicetypes -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          devices = data.get("devicetypes", [])
          iphones = [d for d in devices if str(d.get("name", "")).startswith("iPhone")]
          if not iphones:
              raise SystemExit("No iPhone simulator device type found")
          preferred = next((d for d in iphones if d.get("name") == "iPhone 17 Pro"), None)
          chosen = preferred or iphones[0]
          print(chosen["identifier"])
          ')

          UDID=$(xcrun simctl create "Irfaali CI" "$DEVICE_TYPE_ID" "$RUNTIME_ID")
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          echo "Created simulator: $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl list devices "$RUNTIME_ID"

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project Irfaali.xcodeproj \
            -scheme Irfaali \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -destination-timeout 120 \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild \
            -project Irfaali.xcodeproj \
            -scheme Irfaali \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -destination-timeout 120 \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Shutdown CI simulator
        if: always()
        run: |
          if [ -n "${SIMULATOR_UDID:-}" ]; then
            xcrun simctl shutdown "$SIMULATOR_UDID" || true
            xcrun simctl delete "$SIMULATOR_UDID" || true
          fi
